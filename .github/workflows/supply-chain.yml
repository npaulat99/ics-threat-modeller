name: Secure Supply Chain Pipeline

on:
  push:
    branches: ['**']
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ics-threat-modeller
  TRIVY_DISABLE_VEX_NOTICE: "true"

# ===========================================================================
# 1  SOURCE & IAC SCAN
# ===========================================================================
jobs:
  scan_source:
    name: Source & IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (source + dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy IaC scan (Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

      # Generate vulnerability attestation JSONs for later attachment
      - name: Generate vulnerability attestation files
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          mkdir -p attestations
          trivy fs --ignorefile .trivyignore \
            --skip-dirs .git --skip-dirs attestations \
            --skip-dirs node_modules --skip-dirs target \
            --format cosign-vuln . > attestations/vuln-source.json
          trivy config --format cosign-vuln . > attestations/vuln-dockerfile.json || echo '{}' > attestations/vuln-dockerfile.json

      - name: Upload scan attestations
        uses: actions/upload-artifact@v4
        with:
          name: vuln-attestations
          path: attestations/

  # ===========================================================================
  # 2  BUILD & PUSH CONTAINER  (single build, scan after push)
  # ===========================================================================
  build_and_push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: scan_source
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          OWNER_LOWER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER_LOWER,,}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push (with BuildKit provenance + SBOM)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Trivy image scan (post-push)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Generate image vulnerability attestation
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          mkdir -p attestations
          trivy image --ignorefile .trivyignore \
            --format cosign-vuln \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}" > attestations/vuln-image.json

      - name: Upload image attestation
        uses: actions/upload-artifact@v4
        with:
          name: image-attestation
          path: attestations/

  # ===========================================================================
  # 3  SIGN CONTAINER & ATTACH ATTESTATIONS
  # ===========================================================================
  sign_container:
    name: Sign Container & Attach Attestations
    runs-on: ubuntu-latest
    needs: build_and_push
    env:
      IMAGE_REF: ${{ needs.build_and_push.outputs.image_ref }}
      IMAGE_DIGEST: ${{ needs.build_and_push.outputs.digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Download vulnerability attestations
        uses: actions/download-artifact@v4
        with:
          name: vuln-attestations
          path: attestations

      - name: Download image attestation
        uses: actions/download-artifact@v4
        with:
          name: image-attestation
          path: attestations

      - name: Generate SLSA provenance predicate
        run: |
          cat > attestations/provenance.slsa.json <<EOF
          {
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "buildType": "https://github.com/Attestations/GitHubActions@v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.sha }}",
                "digest": {"sha1": "${{ github.sha }}"}
              },
              "parameters": {
                "workflow": "${{ github.workflow }}",
                "ref": "${{ github.ref }}",
                "runner": "${{ runner.os }}"
              }
            },
            "metadata": {
              "buildInvocationId": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "completeness": {"parameters": true, "environment": true, "materials": true}
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.sha }}",
                "digest": {"sha1": "${{ github.sha }}"}
              }
            ]
          }
          EOF

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: attestations/sbom.spdx.json

      - name: Sign container image (keyless)
        run: |
          # Retry up to 3 times with 30s delay on failure
          MAX_RETRIES=3
          RETRY_DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if cosign sign --yes --timeout=5m "${IMAGE_REF}"; then
              echo "Signature pushed successfully"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              else
                echo "All retry attempts exhausted"
                exit 1
              fi
            fi
          done

      - name: Attach all attestations
        run: |
          # Retry logic for attestations
          MAX_RETRIES=3
          RETRY_DELAY=30

          # Rekor transparency log has a ~24 KB entry size limit.
          # Predicates exceeding this (SBOMs, vuln scans) must skip tlog upload.
          REKOR_MAX_BYTES=20480

          for TYPE in provenance sbom vuln-source vuln-dockerfile vuln-image; do
            case $TYPE in
              provenance)      PRED=attestations/provenance.slsa.json;   T=https://slsa.dev/provenance/v1 ;;
              sbom)            PRED=attestations/sbom.spdx.json;         T=https://spdx.dev/Document ;;
              vuln-source)     PRED=attestations/vuln-source.json;       T=https://cosign.dev/attestation/vuln/source ;;
              vuln-dockerfile) PRED=attestations/vuln-dockerfile.json;   T=https://cosign.dev/attestation/vuln/dockerfile ;;
              vuln-image)      PRED=attestations/vuln-image.json;        T=https://cosign.dev/attestation/vuln/image ;;
            esac

            # Determine whether to upload to Rekor tlog based on predicate size
            FILE_SIZE=$(stat -c%s "$PRED" 2>/dev/null || echo 0)
            TLOG_FLAG=""
            if [ "$FILE_SIZE" -gt "$REKOR_MAX_BYTES" ]; then
              TLOG_FLAG="--tlog-upload=false"
              echo "  Predicate is ${FILE_SIZE} bytes (>20KB), skipping Rekor tlog upload"
            fi

            echo "Attaching attestation: $TYPE (${FILE_SIZE} bytes)"
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $i of $MAX_RETRIES..."
              if cosign attest --yes --timeout=5m $TLOG_FLAG --type "$T" --predicate "$PRED" "${IMAGE_REF}"; then
                echo "  Attestation $TYPE attached successfully"
                break
              else
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "  Failed, retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                else
                  echo "  All retry attempts exhausted for $TYPE"
                  exit 1
                fi
              fi
            done
            # Brief pause between attestations to avoid Rekor rate-limiting
            sleep 5
          done

  # ===========================================================================
  # 4  VERIFY CONTAINER  (consumer simulation)
  # ===========================================================================
  verify_container:
    name: Verify Container (Consumer Simulation)
    runs-on: ubuntu-latest
    needs:
      - build_and_push
      - sign_container
    env:
      IMAGE_REF: ${{ needs.build_and_push.outputs.image_ref }}
      IMAGE_DIGEST: ${{ needs.build_and_push.outputs.digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Pull image
        run: docker pull "${IMAGE_REF}"

      - name: Verify container signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/.+" \
            --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"

      - name: Verify all attestations
        run: |
          for TYPE in \
            "https://slsa.dev/provenance/v1" \
            "https://spdx.dev/Document" \
            "https://cosign.dev/attestation/vuln/source" \
            "https://cosign.dev/attestation/vuln/dockerfile" \
            "https://cosign.dev/attestation/vuln/image"; do
            echo "Verifying attestation: $TYPE"
            # Try with tlog first; fall back to --insecure-ignore-tlog for
            # attestations whose predicates exceeded Rekor's 24 KB size limit.
            if ! cosign verify-attestation \
              --type "$TYPE" \
              --certificate-identity-regexp="https://github.com/.+" \
              --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
              "${IMAGE_REF}" > /dev/null 2>&1; then
              echo "  tlog entry unavailable (large predicate), verifying signature only..."
              cosign verify-attestation \
                --type "$TYPE" \
                --insecure-ignore-tlog \
                --certificate-identity-regexp="https://github.com/.+" \
                --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
                "${IMAGE_REF}" > /dev/null
            fi
            echo "  OK: $TYPE"
          done
          echo "All attestations verified."

      - name: Check Rekor transparency log
        run: |
          sudo apt-get update -qq && sudo apt-get install -yqq jq > /dev/null 2>&1
          curl -sSfL \
            "https://github.com/sigstore/rekor/releases/latest/download/rekor-cli-linux-amd64" \
            -o rekor-cli
          sudo install -m 0755 rekor-cli /usr/local/bin/rekor-cli
          HASH="${IMAGE_DIGEST#sha256:}"
          echo "Searching Rekor for ${HASH}"
          rekor-cli search --sha "$HASH" --format json > rekor-output.json
          jq . rekor-output.json
          ENTRY_COUNT=$(jq -r '.UUIDs | length' rekor-output.json)
          # At minimum: container signature + provenance attestation.
          # Large predicates (SBOM, vuln scans) skip tlog, so the count varies.
          if [ "$ENTRY_COUNT" -lt 2 ]; then
            echo "FAIL: Expected at least 2 Rekor entries (signature + provenance), found $ENTRY_COUNT" && exit 1
          fi
          echo "Rekor has $ENTRY_COUNT entries (>= 2)."

      - name: Run container smoke test
        run: |
          # The Tauri binary requires a display — verify it exists and returns --help
          docker run --rm --entrypoint /app/ics-threat-modeller "${IMAGE_REF}" --help 2>&1 || echo "Binary present (GUI app, no headless mode expected)."

      - name: Upload Rekor output
        uses: actions/upload-artifact@v4
        with:
          name: rekor-output
          path: rekor-output.json

  # ===========================================================================
  # 5  BUILD & SIGN BINARY  (only on v* tags or manual dispatch)
  # ===========================================================================
  build_binary:
    name: Build & Sign Binary
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify_container
    outputs:
      binary_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: Build binary via Docker (multi-stage)
        run: |
          docker build --target builder -t ics-build .
          mkdir -p release-staging
          docker run --rm -v "$(pwd)/release-staging:/output" ics-build sh -c \
            'cp /app/src-tauri/target/release/ics-threat-modeller /output/'
          chmod +x release-staging/ics-threat-modeller
          ls -lh release-staging/

      - name: Smoke-test binary
        run: |
          file release-staging/ics-threat-modeller
          release-staging/ics-threat-modeller --help 2>&1 || echo "Binary present (GUI app requires display)."

      - name: Compute SHA256 hash
        id: hash
        run: |
          HASH=$(sha256sum release-staging/ics-threat-modeller | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Binary SHA256: $HASH"

      - uses: sigstore/cosign-installer@v3

      - name: Sign binary with Cosign (keyless blob signing)
        run: |
          cosign sign-blob --yes \
            --bundle release-staging/ics-threat-modeller.cosign.bundle \
            release-staging/ics-threat-modeller

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ics-threat-modeller-binary
          path: release-staging/

  # ===========================================================================
  # 6  VERIFY & RUN BINARY  (consumer simulation)
  # ===========================================================================
  verify_binary:
    name: Verify & Run Binary
    runs-on: ubuntu-latest
    needs: build_binary
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ics-threat-modeller-binary
          path: ./binary

      - uses: sigstore/cosign-installer@v3

      - name: Verify binary signature
        run: |
          cosign verify-blob \
            --bundle binary/ics-threat-modeller.cosign.bundle \
            --certificate-identity-regexp="https://github.com/.+" \
            --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
            binary/ics-threat-modeller
          echo "Binary signature verified."

      - name: Run verified binary
        run: |
          chmod +x binary/ics-threat-modeller
          file binary/ics-threat-modeller
          binary/ics-threat-modeller --help 2>&1 || echo "Binary verified (GUI app requires display)."

  # ===========================================================================
  # 7  PUBLISH GITHUB RELEASE  (only on v* tags)
  # ===========================================================================
  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify_binary
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ics-threat-modeller-binary
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ICS Threat Modeller ${{ github.ref_name }}"
          body: |
            ## Signed Binary Release

            This release contains the signed `ics-threat-modeller` Linux binary
            (built on Ubuntu 22.04 / Debian Bookworm, glibc 2.36).

            ### Verification
            Download both files and verify the signature before running:
            ```bash
            cosign verify-blob \
              --bundle ics-threat-modeller.cosign.bundle \
              --certificate-identity-regexp="https://github.com/.+" \
              --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
              ics-threat-modeller
            ```

            ### Prerequisites
            ```bash
            sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
            ```

            ### Usage
            ```bash
            chmod +x ics-threat-modeller
            ./ics-threat-modeller
            ```
          files: |
            release/ics-threat-modeller
            release/ics-threat-modeller.cosign.bundle
          draft: false
          prerelease: false
