version: "3.8"

services:
  ics-threat-modeller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ics-threat-modeller
    ports:
      - "6080:6080"
    environment:
      - SCREEN_WIDTH=1400
      - SCREEN_HEIGHT=900
    volumes:
      # Persist database across container restarts.
      - ics-data:/app/data
    security_opt:
      - seccomp:unconfined

  # Development build service (does not run the app).
  build-only:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: ics-build
    volumes:
      - ./output:/output
    command: >
      sh -c "
        mkdir -p /output &&
        cp /app/src-tauri/target/release/ics-threat-modeller /output/ 2>/dev/null || true &&
        cp -r /app/src-tauri/target/release/bundle/ /output/bundle/ 2>/dev/null || true &&
        echo 'Build artifacts copied to ./output/'
      "

volumes:
  ics-data:
    driver: local
