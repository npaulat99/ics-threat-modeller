name: Credential Theft
description: Attack tree template for credential theft targeting ICS systems.
entry_type: attack_tree
source_framework: MITRE ATT&CK for ICS
version: "1.0"
tags: []
tree_data:
  goal:
    name: Steal ICS Credentials
    description: Obtain valid credentials for ICS systems to enable further attacks.
    aggregation_type: or
  steps:
    - name: Default Credential Exploitation
      description: Use known default credentials on ICS devices.
      is_leaf: true
      assessments:
        - factor_name: Elapsed Time
          factor_value: 1
          rationale: Trivial to attempt.
        - factor_name: Expertise
          factor_value: 2
          rationale: Publicly available lists.
        - factor_name: Knowledge of Target
          factor_value: 3
          rationale: Device model identification.
        - factor_name: Window of Opportunity
          factor_value: 4
          rationale: Network access to device.
        - factor_name: Equipment
          factor_value: 1
          rationale: Standard tools.
      countermeasures:
        - name: Change Default Passwords
          description: Replace all factory-default credentials.
          effectiveness: 5
        - name: Password Policy
          description: Enforce strong password policy for OT systems.
          effectiveness: 4
      technique_mappings:
        - technique_id: T0812
          technique_name: Default Credentials
          source: MITRE ATT&CK for ICS
    - name: Credential Harvesting from IT/OT Convergence
      description: Extract credentials from shared IT/OT authentication systems.
      is_leaf: true
      assessments:
        - factor_name: Elapsed Time
          factor_value: 4
          rationale: Active directory enumeration.
        - factor_name: Expertise
          factor_value: 5
          rationale: AD exploitation skills.
        - factor_name: Knowledge of Target
          factor_value: 4
          rationale: AD structure knowledge.
        - factor_name: Window of Opportunity
          factor_value: 5
          rationale: IT network access.
        - factor_name: Equipment
          factor_value: 3
          rationale: Credential dumping tools.
      countermeasures:
        - name: Separate OT Authentication
          description: Dedicated authentication for OT systems.
          effectiveness: 4
        - name: Multi-Factor Authentication
          description: MFA for critical ICS access.
          effectiveness: 4
      technique_mappings:
        - technique_id: T0859
          technique_name: Valid Accounts
          source: MITRE ATT&CK for ICS
