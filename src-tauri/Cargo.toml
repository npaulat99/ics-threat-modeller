[package]
name = "ics-threat-modeller"
version = "1.0.0"
description = "Database-backed threat modeling tool for embedded field devices"
authors = ["ICS Threat Modeller Team"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ics_threat_modeller_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ics-threat-modeller"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
rusqlite = { version = "0.38", features = ["bundled", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
